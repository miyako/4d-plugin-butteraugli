name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: butteraugli
  MACOS_DEPLOYMENT_TARGET: '10.15'
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: butteraugli-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight
          VERSION=$(python3 .github/scripts/source_version.py read)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: build with CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'butteraugli/butteraugli-test/Plugins/butteraugli/Contents'
          foreach ($file in @('Windows64/butteraugli.4DX', 'Resources/manifest.json', 'Resources/constants.xlf')) {
            $path = Join-Path $out $file
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -ErrorAction Stop }
          }
          cd ${{ env.PRODUCT_NAME }}
          mkdir cmake-build; cd cmake-build
          cmake .. -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build . --config Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          $binary = '../butteraugli-test/Plugins/butteraugli/Contents/Windows64/butteraugli.4DX'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf) -or (Get-Item -LiteralPath $binary).Length -eq 0) {
            throw 'Windows output is missing or empty'
          }

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ${{ env.PRODUCT_NAME }}/${{ env.PRODUCT_NAME }}-test/Plugins/${{ env.PRODUCT_NAME }}/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Initial clean preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          python3 .github/scripts/native.py clean
          cd ${{ env.PRODUCT_NAME }}
          mkdir -p cmake-build && cd cmake-build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}"
          cmake --build .

      - name: verify universal binary
        run: |
          set -euo pipefail
          python3 .github/scripts/native.py verify

      - name: merge Windows binaries into the bundle
        run: |
          set -euo pipefail
          BUNDLE="${{ env.PRODUCT_NAME }}/${{ env.PRODUCT_NAME }}-test/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          mkdir -p "$BUNDLE/Contents/Windows64"
          cp "winbuild/${{ env.PRODUCT_NAME }}.4DX" "$BUNDLE/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX"
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.zip"
          DMG_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.dmg"

          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"
          hdiutil create -format UDBZ -volname "${{ env.PRODUCT_NAME }}" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$RUNNER_TEMP/zip-notary.json"
          python3 .github/scripts/native.py accepted "$RUNNER_TEMP/zip-notary.json"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          python3 .github/scripts/native.py accepted "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
