name: Bump

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bump selected branch source
        env:
          BUMP_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 .github/scripts/bump.py --mode "$BUMP_MODE"
